    <title>네온 스네이크 게임 (Neon Snake Game)</title>

    <style>
        * {

        }

        body {
            background: #0d0f18;

                radial-gradient(circle at 85% 80%, rgba(255, 0, 128, 0.08) 0%, transparent 40%);

            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;

                        0 0 30px rgba(0, 255, 204, 0.15);

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00ffcc, #ff007f);
            -webkit-background-clip: text;

        .top-controls {

        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #00ffcc;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: center;

        }

        .icon-btn:hover {
            background: rgba(0, 255, 204, 0.2);
            border-color: #00ffcc;
            transform: translateY(-2px);
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
        }

        .scoreboard {
            width: 100%;
            display: flex;
            justify-content: space-between;
            background: rgba(10, 14, 26, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);

            border-radius: 16px;

        .score-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .score-label {
            font-size: 0.75rem;
            color: #8a99ad;
            text-transform: uppercase;

        .score-value {
            font-family: 'Orbitron', sans-serif;

        .score-value.high {

        .canvas-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(0, 255, 204, 0.3);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8),

        canvas {

        .overlay {
            position: absolute;
            top: 0;

            width: 100%;
            height: 100%;

            align-items: center;

            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: #ff0055;
            text-shadow: 0 0 20px rgba(255, 0, 85, 0.8);

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }

        .overlay-subtitle {
            font-size: 0.95rem;

        .action-btn {
            background: linear-gradient(135deg, #00ffcc, #0099ff);
            border: none;

            font-size: 1rem;
            padding: 12px 28px;
            border-radius: 30px;

        .action-btn:hover {

        }

        .controls-bar {
            width: 100%;
            display: flex;
            gap: 10px;

        }

        .select-group {
            display: flex;

        select {
            background: transparent;
            border: none;

        .dpad-container {
            display: grid;

        .dpad-btn {
            background: rgba(255, 255, 255, 0.06);

        .dpad-up { grid-column: 2; grid-row: 1; }

        .instructions {
            font-size: 0.75rem;

        /* Media queries for desktop responsiveness */
        @media (min-width: 600px) {
            .dpad-container {
                display: none; /* Hide touch controller on wider desktop displays */
            }
        }

        /* Disqus Comments Section Styling */
        .comments-wrapper {
            background: rgba(22, 27, 46, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(255, 0, 128, 0.1);
            max-width: 520px;
            width: 100%;
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .comments-title {
            font-family: 'Orbitron', sans-serif;

            font-weight: 700;
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Element References
        const currentScoreEl = document.getElementById('currentScore');
        const highScoreEl = document.getElementById('highScore');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayText = document.getElementById('overlayText');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const soundBtn = document.getElementById('soundBtn');
        const resetBtn = document.getElementById('resetBtn');
        const difficultySelect = document.getElementById('difficulty');

        // Grid & Logic Variables
        const GRID_COUNT = 20; // 20x20 Grid
        let cellSize = canvas.width / GRID_COUNT;

        let snake = [];
        let food = { x: 0, y: 0, type: 'normal' };
        let particles = [];
        let dx = 1;
        let dy = 0;
        let nextDx = 1;
        let nextDy = 0;

        let score = 0;
        let highScore = localStorage.getItem('snake_high_score') || 0;
        highScoreEl.textContent = highScore;

        let gameInterval = null;
        let isRunning = false;
        let isPaused = false;
        let isMuted = false;

        // Speed configurations based on difficulty
        const SPEEDS = {
            easy: 130,
            medium: 90,
            hard: 60
        };

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (isMuted || !audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'eat') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'bonus') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.4);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        function initGame() {
            snake = [
                { x: 5, y: 10 },
                { x: 4, y: 10 },
                { x: 3, y: 10 }
            ];
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            score = 0;
            particles = [];
            currentScoreEl.textContent = score;
            spawnFood();
        }

        function spawnFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * GRID_COUNT);
                food.y = Math.floor(Math.random() * GRID_COUNT);
                
                // Ensure food does not spawn on snake body
                valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
            }

            // 20% chance for golden bonus food
            food.type = Math.random() < 0.2 ? 'bonus' : 'normal';
        }

        function createParticles(x, y, color) {
            const particleCount = 12;
            for (let i = 0; i < particleCount; i++) {
                const angle = (Math.PI * 2 / particleCount) * i;
                const speed = Math.random() * 3 + 1;
                particles.push({
                    x: (x + 0.5) * cellSize,
                    y: (y + 0.5) * cellSize,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    color: color
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function draw() {
            // Clear canvas background
            ctx.fillStyle = '#080a12';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Subtle Grid Lines
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * cellSize, 0);
                ctx.lineTo(i * cellSize, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * cellSize);
                ctx.lineTo(canvas.width, i * cellSize);
                ctx.stroke();
            }

            // Draw Particles
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Draw Food
            ctx.save();
            if (food.type === 'bonus') {
                ctx.fillStyle = '#ffd700';
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 15;
            } else {
                ctx.fillStyle = '#ff0055';
                ctx.shadowColor = '#ff0055';
                ctx.shadowBlur = 12;
            }

            const foodRadius = (cellSize / 2) - 2;
            const foodCenterX = food.x * cellSize + cellSize / 2;
            const foodCenterY = food.y * cellSize + cellSize / 2;
            ctx.beginPath();
            ctx.arc(foodCenterX, foodCenterY, foodRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Draw Snake
            snake.forEach((segment, index) => {
                ctx.save();
                const isHead = index === 0;

                if (isHead) {
                    ctx.fillStyle = '#00ffcc';
                    ctx.shadowColor = '#00ffcc';
                    ctx.shadowBlur = 15;
                } else {
                    // Smooth color gradient down snake body
                    const alpha = 1 - (index / snake.length) * 0.5;
                    ctx.fillStyle = `rgba(0, 204, 153, ${alpha})`;
                    ctx.shadowBlur = 0;
                }

                const px = segment.x * cellSize + 1;
                const py = segment.y * cellSize + 1;
                const size = cellSize - 2;
                const radius = isHead ? 6 : 4;

                // Draw Rounded Rectangle for segments
                ctx.beginPath();
                ctx.roundRect(px, py, size, size, radius);
                ctx.fill();

                // Draw Eyes on Head
                if (isHead) {
                    ctx.fillStyle = '#080a12';
                    const eyeOffset = size / 4;
                    let eyeX1, eyeY1, eyeX2, eyeY2;

                    if (dx === 1) { // Right
                        eyeX1 = eyeX2 = px + size - eyeOffset;
                        eyeY1 = py + eyeOffset;
                        eyeY2 = py + size - eyeOffset;
                    } else if (dx === -1) { // Left
                        eyeX1 = eyeX2 = px + eyeOffset;
                        eyeY1 = py + eyeOffset;
                        eyeY2 = py + size - eyeOffset;
                    } else if (dy === -1) { // Up
                        eyeY1 = eyeY2 = py + eyeOffset;
                        eyeX1 = px + eyeOffset;
                        eyeX2 = px + size - eyeOffset;
                    } else { // Down
                        eyeY1 = eyeY2 = py + size - eyeOffset;
                        eyeX1 = px + eyeOffset;
                        eyeX2 = px + size - eyeOffset;
                    }

                    ctx.beginPath();
                    ctx.arc(eyeX1, eyeY1, 2, 0, Math.PI * 2);
                    ctx.arc(eyeX2, eyeY2, 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            });
        }

        function update() {
            dx = nextDx;
            dy = nextDy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wall Collision Check
            if (head.x < 0 || head.x >= GRID_COUNT || head.y < 0 || head.y >= GRID_COUNT) {
                gameOver();
                return;
            }

            // Self Collision Check
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            // Add new head
            snake.unshift(head);

            // Food Eating Check
            if (head.x === food.x && head.y === food.y) {
                const isBonus = food.type === 'bonus';
                const points = isBonus ? 30 : 10;
                score += points;
                currentScoreEl.textContent = score;

                // Play sound & particles
                playSound(isBonus ? 'bonus' : 'eat');
                createParticles(food.x, food.y, isBonus ? '#ffd700' : '#ff0055');

                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    localStorage.setItem('snake_high_score', highScore);
                }

                spawnFood();
            } else {
                // Remove tail if no food eaten
                snake.pop();
            }

            updateParticles();
            draw();
        }

        function startGame() {
            initAudio();
            initGame();
            isRunning = true;
            isPaused = false;
            overlay.classList.remove('active');
            pauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';

            if (gameInterval) clearInterval(gameInterval);
            const speed = SPEEDS[difficultySelect.value] || 90;
            gameInterval = setInterval(update, speed);
        }

        function gameOver() {
            playSound('gameover');
            clearInterval(gameInterval);
            isRunning = false;

            overlayTitle.textContent = "GAME OVER";
            overlayText.textContent = `최종 점수: ${score}점`;
            startBtn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> 다시 하기';
            overlay.classList.add('active');
        }

        function togglePause() {
            if (!isRunning) return;

            if (isPaused) {
                isPaused = false;
                overlay.classList.remove('active');
                pauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                const speed = SPEEDS[difficultySelect.value] || 90;
                gameInterval = setInterval(update, speed);
            } else {
                isPaused = true;
                clearInterval(gameInterval);
                overlayTitle.textContent = "PAUSED";
                overlayText.textContent = "게임을 계속하려면 버튼을 누르세요.";
                startBtn.innerHTML = '<i class="fa-solid fa-play"></i> 계속하기';
                overlay.classList.add('active');
                pauseBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
            }
        }

        function changeDirection(newDx, newDy) {
            // Prevent 180-degree reverse direction turns
            if (newDx === -dx && newDx !== 0) return;
            if (newDy === -dy && newDy !== 0) return;
            nextDx = newDx;
            nextDy = newDy;
        }

        // Keyboard Controls
        window.addEventListener('keydown', e => {
            initAudio();
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    changeDirection(0, -1);
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    changeDirection(0, 1);
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    changeDirection(-1, 0);
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    changeDirection(1, 0);
                    break;
                case ' ':
                    if (!isRunning) {
                        startGame();
                    } else {
                        togglePause();
                    }
                    break;
            }
        });

        // Touch Control D-Pad Buttons
        document.getElementById('btnUp').addEventListener('click', () => changeDirection(0, -1));
        document.getElementById('btnDown').addEventListener('click', () => changeDirection(0, 1));
        document.getElementById('btnLeft').addEventListener('click', () => changeDirection(-1, 0));
        document.getElementById('btnRight').addEventListener('click', () => changeDirection(1, 0));

        // Touch Swipe Gestures on Canvas
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        canvas.addEventListener('touchend', e => {
            if (!isRunning) return;
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;

            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > 20) {
                    changeDirection(diffX > 0 ? 1 : -1, 0);
                }
            } else {
                if (Math.abs(diffY) > 20) {
                    changeDirection(0, diffY > 0 ? 1 : -1);
                }
            }
        }, { passive: true });

        // Action Buttons
        startBtn.addEventListener('click', () => {
            if (isPaused) {
                togglePause();
            } else {
                startGame();
            }
        });

        pauseBtn.addEventListener('click', togglePause);

        resetBtn.addEventListener('click', () => {
            clearInterval(gameInterval);
            isRunning = false;
            initGame();
            draw();
            overlayTitle.textContent = "NEON SNAKE";
            overlayText.textContent = "게임을 새로 시작합니다.";
            startBtn.innerHTML = '<i class="fa-solid fa-play"></i> GAME START';
            overlay.classList.add('active');
        });

        soundBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            soundBtn.innerHTML = isMuted 
                ? '<i class="fa-solid fa-volume-xmark" style="color: #ff0055;"></i>' 
                : '<i class="fa-solid fa-volume-high"></i>';
        });

        // Initial Canvas Rendering
        initGame();
        draw();
    </script>
</body>
</html>
